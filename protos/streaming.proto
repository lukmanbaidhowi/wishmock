syntax = "proto3";
package streaming;

service StreamService {
  // Server streaming: returns multiple messages
  rpc GetMessages (MessageRequest) returns (stream MessageResponse);
  
  // Server streaming: returns multiple events
  rpc WatchEvents (EventRequest) returns (stream EventResponse);
  // Client streaming: accepts multiple messages, returns summary
  rpc UploadMessages (stream UploadRequest) returns (UploadSummary);

  // Bidirectional streaming: chat
  rpc Chat (stream ChatRequest) returns (stream ChatResponse);
}

message MessageRequest {
  string user_id = 1;
  int32 limit = 2;
}

message MessageResponse {
  string id = 1;
  string content = 2;
  int64 timestamp = 3;
  string sender = 4;
}

message EventRequest {
  string topic = 1;
  repeated string filters = 2;
}

message EventResponse {
  string event_id = 1;
  string event_type = 2;
  string data = 3;
  int64 created_at = 4;
}

message UploadRequest {
  string content = 1;
}

message UploadSummary {
  int32 count = 1;
  string status = 2;
}

message ChatRequest {
  string query = 1;
}

message ChatResponse {
  string reply = 1;
}